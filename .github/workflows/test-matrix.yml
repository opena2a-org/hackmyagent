name: Test matrix

# Runs the full suite on PRs, on BOTH platforms.
#
# Why this exists: until now `release.yml` was the only workflow that ran
# `npm test`, and it triggers on `v*` tags. Under Trusted Publishing the tag
# push IS the publish event, so the suite's first execution on Linux was also
# the release — and 0.25.2 failed there with 12 failures across 3 files that
# every developer machine reported green, because they are all macOS.
#
# A suite that only ever runs on one platform is a suite that certifies one
# platform. This job makes the other one visible at PR time instead of at
# publish time.

on:
  # Manual runs on an exact ref: a release tag commit that is not on main
  # (0.33.2 is cut on a release branch) gets its witness on its own tree,
  # not on a pull-request merge ref.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # BLOCKING. This job was `continue-on-error: true` for the three commits it
    # took to close the failures that predated it, and that exemption is now
    # spent. Both platforms are green: 225 files passed, 3 skipped, on each.
    #
    # Do not reinstate it for a new failure. A red Linux job on a PR that made
    # it red is a defect in that PR, and the entire reason this workflow exists
    # is that `release.yml` was the only thing running `npm test` — so the
    # suite's first execution on Linux was a tag push, which under Trusted
    # Publishing IS the publish event.
    #
    # Two suites are deliberately narrower on Linux, both gated on a runtime
    # probe rather than on `process.platform` where that was possible:
    # `backup-archive-integrity` (2 cases needing a case-folding filesystem)
    # and `fix-write-failure-integrity` (11 cases whose failure injection is
    # `chflags uchg`, which is BSD-only). macOS runs both, so each property
    # still fails somewhere.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the pull-request merge commit and both parents
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refuse tracked package-manager config
        # A tracked .npmrc (or yarn/pnpm/direnv equivalent) redirects or hooks
        # the install that follows it. Fails when the grep prints anything.
        run: |
          if git ls-files | grep -E '(^|/)(\.npmrc|\.yarnrc(\.yml)?|\.pnpmfile\.cjs|\.envrc)$'; then
            echo "::error::A tracked package-manager config file is in the tree; it can redirect or hook the install below. Remove it."
            exit 1
          fi
      - name: Changelog fragments
        # scripts/changelog.mjs check: entries are fragments in changelog.d/, and
        # CHANGELOG.md changes only in the shapes the script admits. An ordinary
        # change is judged by the base commit's copy of the script, so a change
        # cannot rewrite the rule that judges it. A change to the script itself
        # (or the conversion change, whose base has no script) runs its own copy;
        # R5 is then enforced here, in the workflow and not in the script under
        # change: such a change may not touch any CHANGELOG.md, and may not
        # modify, delete or rename a file under changelog.d/ other than an edit
        # of changelog.d/README.md, which documents the script.
        #
        # The base is part of the tree under test, not a payload field: on a pull
        # request it is the first parent of the merge commit being tested, which
        # the payload's base.sha can fall behind. A manual run is judged against
        # its merge base with main. Every event without a resolvable base fails.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request)
              [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] && [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ] \
                || { echo "::error::expected the pull-request merge commit $GITHUB_SHA with two parents"; exit 1; }
              BASE=$(git rev-parse HEAD^1) ;;
            push)
              BASE="$BEFORE"
              if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
                echo "::error::push event without a previous commit; refusing a check with no base"; exit 1
              fi
              git fetch --no-tags --depth=1 origin "$BASE" ;;
            merge_group)
              BASE="$MERGE_GROUP_BASE"
              [ -n "$BASE" ] || { echo "::error::merge_group event without merge_group.base_sha; refusing a check with no base"; exit 1; }
              git fetch --no-tags --depth=1 origin "$BASE" ;;
            workflow_dispatch)
              deepen=""
              [ "$(git rev-parse --is-shallow-repository)" = "true" ] && deepen="--unshallow"
              git fetch --no-tags $deepen origin +refs/heads/main:refs/remotes/origin/main \
                || { echo "::error::cannot fetch main to find this run's merge base"; exit 1; }
              BASE=$(git merge-base HEAD refs/remotes/origin/main) && [ -n "$BASE" ] \
                || { echo "::error::no merge base between HEAD and main; refusing a check with no base"; exit 1; } ;;
            *)
              echo "::error::no changelog base is defined for the $EVENT event"; exit 1 ;;
          esac
          if git cat-file -e "$BASE:scripts/changelog.mjs" 2>/dev/null && git diff --quiet "$BASE" HEAD -- scripts/changelog.mjs; then
            git show "$BASE:scripts/changelog.mjs" > "$RUNNER_TEMP/changelog-base.mjs"
            node "$RUNNER_TEMP/changelog-base.mjs" check --base "$BASE"   # judged by the base's rules
          else
            if git cat-file -e "$BASE:scripts/changelog.mjs" 2>/dev/null; then
              # R5: the script changed, so this change carries no changelog record.
              changes=$(git diff --name-status -M "$BASE" HEAD) \
                || { echo "::error::cannot list the changes against $BASE"; exit 1; }
              refused=$(printf '%s\n' "$changes" | awk -F '\t' '
                function record(p) { return p ~ /(^|\/)CHANGELOG\.md"?$/ }
                function fragdir(p) { return p ~ /^"?(.*\/)?changelog\.d\// }
                function readme(p) { return p ~ /^"?(.*\/)?changelog\.d\/README\.md"?$/ }
                NF == 0 { next }
                substr($1, 1, 1) == "R" { if (record($2) || record($3) || fragdir($2) || fragdir($3)) print; next }
                record($2) { print; next }
                fragdir($2) && $1 == "M" && readme($2) { next }
                fragdir($2) && $1 != "A" { print }
              ') || { echo "::error::cannot classify the changes against $BASE"; exit 1; }
              if [ -n "$refused" ]; then
                echo "::error::R5: scripts/changelog.mjs changed, so no CHANGELOG.md may change and no file under changelog.d/ may be modified, deleted or renamed in the same change:"
                printf '%s\n' "$refused"
                exit 1
              fi
            fi
            node scripts/changelog.mjs check --base "$BASE"               # conversion PR or tooling-only PR
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Corpus release smoke
        # The corpus lives outside the repo, so this only runs where it exists.
        run: |
          if [ -d "$HOME/.opena2a/corpus" ]; then
            npm run release-smoke:corpus
          else
            echo "corpus not present on this runner; skipped"
          fi
