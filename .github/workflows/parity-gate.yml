name: parity-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on EVERY pull request, unconditionally, so a check named
  # `parity / parity` is always reported and can be a required context on
  # main without stranding any PR.
  # History: a `paths:` filter made the check absent (not skipped) on
  # non-matching PRs, so it could not be required -- and an unrequired
  # parity leg blocks nothing: #636 merged red. A run-or-skip predicate job
  # was tried next (#641), but a skipped caller job reports its check under
  # the caller job's own name, `parity`, while a running one expands the
  # reusable workflow to `parity / parity` -- two names, so a single
  # required context would strand non-matching PRs all over again (#642).
  # Running unconditionally keeps a single name that is always present.
  parity:
    # opena2a-parity moved from opena2a-org to opena2a-standards on 2026-05-24.
    # Pinned to the current main SHA; bumps require an explicit, reviewable PR.
    # The pin controls only the workflow steps: on cross-repo calls the
    # harness and goldens check out from opena2a-parity main (see the checkout
    # ref logic in parity.yml), so golden re-baselines land without a bump.
    # 2026-06-01: c861cf8 picks up scan-soul-hardened re-baseline for HMA 0.23.6
    # scope-aware clamp (expected score 74/B/standard, was 100/A/hardened) and
    # the parity workflow self-checkout owner-check fix (opena2a-standards
    # owner now recognised on self-runs).
    # 2026-06-10: 9636e7a re-baselines ai-trust goldens to the curated --json
    # shape (ai-trust#61 intentionally omits scan-only fields like scanStatus
    # from registry-source output) — unbreaks the red main runs since 06-08.
    uses: opena2a-standards/opena2a-parity/.github/workflows/parity.yml@9636e7a673fb1ad6d5c761beee065405a50b3eca
    with:
      hma_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      opena2a_ref: main
      ai_trust_ref: main
